<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Account - LocalKart</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">


{% include 'includes/navbar.html' %}


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">


            <!-- Header -->

            <div class="mb-4">

                <h2 class="fw-bold">
                    👤 My Account
                </h2>

                <p class="text-muted">
                    Manage your LocalKart account
                </p>

            </div>


            <!-- Account Statistics -->

            <div class="row g-3 mb-4">

                <div class="col-md-6">

                    <div class="card shadow-sm">

                        <div class="card-body text-center">

                            <div class="fs-1">
                                📦
                            </div>

                            <h3 class="fw-bold">
                                {{ total_orders }}
                            </h3>

                            <p class="text-muted mb-0">
                                Total Orders
                            </p>

                        </div>

                    </div>

                </div>


                <div class="col-md-6">

                    <div class="card shadow-sm">

                        <div class="card-body text-center">

                            <div class="fs-1">
                                ✅
                            </div>

                            <h3 class="fw-bold">
                                {{ delivered_orders }}
                            </h3>

                            <p class="text-muted mb-0">
                                Delivered Orders
                            </p>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Profile -->

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h4 class="fw-bold mb-4">
                        Personal Information
                    </h4>


                    <form method="POST">

                        {% csrf_token %}


                        <!-- Username -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Username
                            </label>

                            {{ form.username }}

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Email
                            </label>

                            {{ form.email }}

                        </div>


                        <!-- Phone -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Phone
                            </label>

                            {{ form.phone }}

                        </div>


                        <!-- Role -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Account Type
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                value="{{ user.get_role_display }}"
                                disabled
                            >

                        </div>


                        <div class="d-flex gap-2">

                            <a
                                href="{% url 'customer_dashboard' %}"
                                class="btn btn-outline-secondary"
                            >
                                ← Dashboard
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                💾 Save Changes
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
