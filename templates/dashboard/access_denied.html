```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Access Denied - Yumzo</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #fff1f2, transparent 35%),
                radial-gradient(circle at bottom right, #fff5e9, transparent 35%),
                #f8f9fa;
            color: #212529;
        }

        .page-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .access-card {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 26px;
            overflow: hidden;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .top-section {
            background: linear-gradient(
                135deg,
                #e23744,
                #ff7a00
            );
            padding: 35px 25px;
            color: #ffffff;
        }

        .brand {
            font-size: 28px;
            font-weight: 850;
            margin-bottom: 22px;
        }

        .brand span {
            color: #ffe3c4;
        }

        .icon-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.17);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            font-size: 43px;
        }

        .content {
            padding: 35px 30px 40px;
        }

        .title {
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .message {
            color: #6c757d;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .warning-box {
            background: #fff0f1;
            border: 1px solid #f5c2c7;
            color: #842029;
            border-radius: 13px;
            padding: 14px 16px;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .dashboard-btn {
            display: inline-block;
            background: #e23744;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            padding: 12px 25px;
            font-weight: 750;
            transition: 0.2s ease;
        }

        .dashboard-btn:hover {
            background: #c92f3b;
            color: #ffffff;
            transform: translateY(-1px);
        }

        .footer {
            margin-top: 25px;
            color: #8a8f98;
            font-size: 13px;
        }

        @media (max-width: 576px) {

            .page-wrapper {
                padding: 15px;
            }

            .content {
                padding: 30px 20px 35px;
            }

            .title {
                font-size: 24px;
            }

        }

    </style>

</head>

<body>


<div class="page-wrapper">

    <div class="access-card">


        <!-- HEADER -->

        <div class="top-section">

            <div class="brand">
                🍽️ Yum<span>zo</span>
            </div>

            <div class="icon-circle">
                🚫
            </div>

        </div>


        <!-- CONTENT -->

        <div class="content">

            <div class="title">
                Access Denied
            </div>

            <p class="message">
                You do not have permission to access the
                admin dashboard.
            </p>


            <div class="warning-box">

                🔒
                This area is restricted to authorized
                administrators only.

            </div>


            <a
                href="{% url 'customer_dashboard' %}"
                class="dashboard-btn"
            >
                ← Back to Dashboard
            </a>


            <div class="footer">

                © 2026 <strong>Yumzo</strong> ·
                Food delivery made simple.

            </div>

        </div>

    </div>

</div>


</body>

</html>
