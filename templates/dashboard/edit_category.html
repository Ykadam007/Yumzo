```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Category | Yumzo Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at top left,
                    #fff1f2,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #fff4e8,
                    transparent 35%
                ),
                #f7f7f8;
            color: #212529;
        }

        /* =========================
           NAVBAR
        ========================= */

        .yumzo-navbar {
            background: #ffffff;
            border-bottom: 1px solid #eeeeee;
            padding: 16px 0;
        }

        .brand {
            text-decoration: none;
            font-size: 26px;
            font-weight: 900;
            color: #e23744;
        }

        .brand span {
            color: #ff7a00;
        }

        .admin-badge {
            display: inline-block;
            margin-left: 8px;
            padding: 5px 9px;
            border-radius: 8px;
            background: #fff1f2;
            color: #e23744;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .5px;
            vertical-align: middle;
        }

        .logout-btn {
            border: 1px solid #dc3545;
            color: #dc3545;
            background: #ffffff;
            border-radius: 9px;
            padding: 8px 15px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: .2s ease;
        }

        .logout-btn:hover {
            background: #dc3545;
            color: #ffffff;
        }

        /* =========================
           PAGE
        ========================= */

        .page-wrapper {
            min-height: calc(100vh - 75px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 45px 20px;
        }

        .category-card {
            width: 100%;
            max-width: 560px;
            background: #ffffff;
            border: 1px solid #eeeeee;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .08);
        }

        /* =========================
           HEADER
        ========================= */

        .card-header-custom {
            background: linear-gradient(
                135deg,
                #e23744,
                #ff7a00
            );
            padding: 30px;
            color: #ffffff;
        }

        .header-icon {
            width: 55px;
            height: 55px;
            border-radius: 15px;
            background: rgba(255, 255, 255, .18);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 17px;
        }

        .card-header-custom h1 {
            font-size: 24px;
            font-weight: 850;
            margin: 0 0 6px;
        }

        .card-header-custom p {
            margin: 0;
            font-size: 13px;
            opacity: .9;
        }

        /* =========================
           FORM
        ========================= */

        .card-content {
            padding: 32px;
        }

        .category-label {
            font-size: 12px;
            color: #555555;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 8px;
        }

        .category-input {
            width: 100%;
            border: 1px solid #dddddd;
            border-radius: 12px;
            padding: 13px 15px;
            font-size: 14px;
            outline: none;
            transition: .2s ease;
        }

        .category-input:focus {
            border-color: #e23744;
            box-shadow: 0 0 0 3px rgba(226, 55, 68, .10);
        }

        .helper-text {
            color: #888888;
            font-size: 12px;
            margin-top: 8px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 28px;
        }

        .save-btn {
            flex: 1;
            border: none;
            background: #e23744;
            color: #ffffff;
            border-radius: 11px;
            padding: 12px 18px;
            font-size: 13px;
            font-weight: 800;
            transition: .2s ease;
        }

        .save-btn:hover {
            background: #c92f3b;
            transform: translateY(-1px);
        }

        .cancel-btn {
            flex: 1;
            text-align: center;
            border: 1px solid #dddddd;
            background: #ffffff;
            color: #555555;
            border-radius: 11px;
            padding: 12px 18px;
            font-size: 13px;
            font-weight: 750;
            text-decoration: none;
            transition: .2s ease;
        }

        .cancel-btn:hover {
            background: #f5f5f5;
            color: #333333;
        }

        /* =========================
           FOOTER
        ========================= */

        .card-footer-custom {
            border-top: 1px solid #eeeeee;
            padding: 17px 30px;
            text-align: center;
            color: #999999;
            font-size: 12px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 576px) {

            .yumzo-navbar .container {
                padding-left: 18px;
                padding-right: 18px;
            }

            .brand {
                font-size: 22px;
            }

            .admin-badge {
                display: none;
            }

            .page-wrapper {
                padding: 25px 15px;
            }

            .card-header-custom {
                padding: 25px;
            }

            .card-content {
                padding: 25px 20px;
            }

            .card-footer-custom {
                padding: 15px 20px;
            }

            .action-buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="yumzo-navbar">

    <div
        class="container d-flex justify-content-between align-items-center"
    >

        <a
            href="{% url 'admin_dashboard' %}"
            class="brand"
        >
            🍽️ Yum<span>zo</span>

            <span class="admin-badge">
                Admin
            </span>
        </a>


        <a
            href="{% url 'logout' %}"
            class="logout-btn"
        >
            🚪 Logout
        </a>

    </div>

</nav>



<!-- =========================
     MAIN
========================= -->

<div class="page-wrapper">

    <div class="category-card">


        <!-- HEADER -->

        <div class="card-header-custom">

            <div class="header-icon">
                ✏️
            </div>

            <h1>
                Edit Category
            </h1>

            <p>
                Update the category name for your Yumzo marketplace.
            </p>

        </div>



        <!-- FORM -->

        <div class="card-content">

            <form method="post">

                {% csrf_token %}


                <div>

                    <label
                        for="name"
                        class="category-label"
                    >
                        Category Name
                    </label>


                    <input
                        type="text"
                        id="name"
                        name="name"
                        class="category-input"
                        value="{{ category.name }}"
                        placeholder="Enter category name"
                        required
                    >


                    <div class="helper-text">
                        Keep the category name short and easy for customers
                        to understand.
                    </div>

                </div>



                <div class="action-buttons">


                    <button
                        type="submit"
                        class="save-btn"
                    >
                        💾 Save Changes
                    </button>


                    <a
                        href="{% url 'manage_categories' %}"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>


                </div>


            </form>

        </div>



        <!-- FOOTER -->

        <div class="card-footer-custom">

            © 2026 <strong>Yumzo</strong> ·
            Manage your food categories easily.

        </div>


    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
```
