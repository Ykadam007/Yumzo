<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product | LocalKart</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">✏️ Edit Product</h4>
                </div>

                <div class="card-body p-4">

                    <form method="post" enctype="multipart/form-data">

                        {% csrf_token %}

                        <!-- Product Name -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Product Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                value="{{ product.name }}"
                                required
                            >
                        </div>


                        <!-- Category -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Category
                            </label>

                            <select
                                name="category"
                                class="form-select"
                                required
                            >
                                <option value="">
                                    Select Category
                                </option>

                                {% for category in categories %}
                                    <option
                                        value="{{ category.id }}"
                                        {% if product.category_id == category.id %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ category.name }}
                                    </option>
                                {% endfor %}

                            </select>
                        </div>


                        <!-- Description -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="4"
                            >{{ product.description }}</textarea>
                        </div>


                        <div class="row">

                            <!-- Price -->
                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Price
                                </label>

                                <input
                                    type="number"
                                    name="price"
                                    class="form-control"
                                    value="{{ product.price }}"
                                    step="0.01"
                                    min="0"
                                    required
                                >

                            </div>


                            <!-- Discount Price -->
                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Discount Price
                                </label>

                                <input
                                    type="number"
                                    name="discount_price"
                                    class="form-control"
                                    value="{{ product.discount_price|default_if_none:'' }}"
                                    step="0.01"
                                    min="0"
                                >

                            </div>

                        </div>


                        <!-- Stock -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Stock
                            </label>

                            <input
                                type="number"
                                name="stock"
                                class="form-control"
                                value="{{ product.stock }}"
                                min="0"
                                required
                            >

                        </div>


                        <!-- Current Image -->
                        {% if product.image %}

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Current Image
                                </label>

                                <div>
                                    <img
                                        src="{{ product.image.url }}"
                                        alt="{{ product.name }}"
                                        class="img-thumbnail"
                                        style="max-width: 180px; max-height: 180px;"
                                    >
                                </div>

                            </div>

                        {% endif %}


                        <!-- New Image -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Change Product Image
                            </label>

                            <input
                                type="file"
                                name="image"
                                class="form-control"
                                accept="image/*"
                            >

                            <small class="text-muted">
                                Leave empty to keep the current image.
                            </small>

                        </div>


                        <!-- Availability -->
                        <div class="form-check mb-4">

                            <input
                                type="checkbox"
                                name="is_available"
                                class="form-check-input"
                                id="is_available"
                                {% if product.is_available %}
                                    checked
                                {% endif %}
                            >

                            <label
                                class="form-check-label"
                                for="is_available"
                            >
                                Product is available
                            </label>

                        </div>


                        <!-- Buttons -->
                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-success"
                            >
                                💾 Save Changes
                            </button>

                            <a
                                href="{% url 'manage_products' %}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
