<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Online Payment - LocalKart</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

{% include 'includes/navbar.html' %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <div class="fs-1">
                            💳
                        </div>

                        <h3 class="fw-bold">
                            Online Payment
                        </h3>

                        <p class="text-muted">
                            Complete your payment securely
                        </p>

                    </div>

                    <div class="alert alert-info">

                        <div class="d-flex justify-content-between">

                            <span>
                                Order
                            </span>

                            <strong>
                                #{{ order.id }}
                            </strong>

                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">

                            <span>
                                Amount to Pay
                            </span>

                            <strong class="text-success fs-4">
                                ₹{{ order.total_amount }}
                            </strong>

                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            Payment Method
                        </label>

                        <div class="border rounded p-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    checked
                                    disabled
                                >

                                <label class="form-check-label">
                                    💳 Online Payment
                                </label>

                            </div>

                            <small class="text-muted">
                                UPI, Credit Card, Debit Card and Net Banking
                            </small>

                        </div>

                    </div>

                    <button
    id="rzp-button"
    class="btn btn-success btn-lg w-100"
>
    💳 Pay ₹{{ order.total_amount }}
</button>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>


<script>
    const options = {
        key: "{{ razorpay_key_id }}",

        amount: "{{ order.total_amount|floatformat:0 }}00",

        currency: "INR",

        name: "LocalKart",

        description: "Payment for Order #{{ order.id }}",

        order_id: "{{ razorpay_order_id }}",

        prefill: {
            name: "{{ order.full_name|escapejs }}",
            contact: "{{ order.phone|escapejs }}"
        },

        modal: {
            ondismiss: function () {

                window.location.href =
                    "{% url 'order_detail' order.id %}";
            }
        },

        handler: function (response) {

            const formData = new FormData();

            formData.append(
                "razorpay_payment_id",
                response.razorpay_payment_id
            );

            formData.append(
                "razorpay_order_id",
                response.razorpay_order_id
            );

            formData.append(
                "razorpay_signature",
                response.razorpay_signature
            );

            formData.append(
                "csrfmiddlewaretoken",
                "{{ csrf_token }}"
            );

            fetch("{% url 'verify_payment' %}", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {

                if (data.success) {

                    window.location.href =
                        "{% url 'payment_result' order.id %}";

                } else {

                    alert(
                        data.message ||
                        "Payment verification failed."
                    );

                    window.location.reload();
                }
            })
            .catch(error => {

                console.error(error);

                alert(
                    "Something went wrong while verifying payment."
                );
            });
        }
    };

    const razorpay = new Razorpay(options);

    document.getElementById("rzp-button").onclick = function(e) {
        razorpay.open();
        e.preventDefault();
    };
</script>

                    <a
                        href="{% url 'order_detail' order.id %}"
                        class="btn btn-outline-secondary w-100 mt-2"
                    >
                        Cancel
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
